
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HostelMate | Warden{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Warden CSS -->
    <link rel="stylesheet" href="{% static 'wardens/css/dashboard.css' %}">
</head>

<body>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <img src="{% static 'accounts/images/hostel_mate.png' %}"
                 alt="HostelMate Logo"
                 class="sidebar-logo">
            <span>HostelMate</span>
        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="{% url 'warden_dashboard' %}"
                   class="{% if request.resolver_match.url_name == 'warden_dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="{% url 'warden_resident_list' %}"
                class="{% if request.resolver_match.url_name == 'warden_resident_list' %}active{% endif %}">
                    <i class="fa-solid fa-users"></i>
                    <span>Residents</span>
                </a>
            </li>
            <li>
                <a href="{% url 'warden_allocation_list' %}"
                class="{% if request.resolver_match.url_name == 'warden_allocation_list' %}active{% endif %}">
                    <i class="fa-solid fa-bed"></i>
                    <span>Room Allocation</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-building"></i>
                    <span>Rooms</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Payments</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notices</span>
                </a>
            </li>

        </ul>

        <div class="sidebar-bottom">
            <form action="{% url 'logout_view' %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </form>
        </div>

    </aside>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Top Navbar -->
        <nav class="top-navbar">

            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="navbar-right">
                <button class="notification-btn">
                    <i class="fa-solid fa-bell"></i>
                </button>

                <div class="profile-dropdown">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>{{ request.user.full_name|default:request.user.username }}</span>
                </div>
            </div>

        </nav>

        <!-- Page Content -->
        <main class="page-content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{% static 'wardens/js/dashboard.js' %}"></script>

</body>
</html>
